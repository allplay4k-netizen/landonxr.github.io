<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store admin</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div class="wrap nav"><a class="wordmark" href="./">3D Prints</a><a class="navlinks" href="./">View shop</a></div></header>
<div id="login-panel" class="panel"><h1>Admin sign in</h1><p class="muted">Sign in with the authorized store account.</p><form id="login-form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">Sign in</button><p id="login-status" class="notice" aria-live="polite"></p></form></div>
<main id="dashboard" class="admin-shell hidden"><div class="admin-head"><div><div class="eyebrow">Store management</div><h1>Products</h1></div><button id="signout" class="secondary">Sign out</button></div><div class="admin-grid"><section class="admin-card"><h2 id="editor-title">Add a product</h2><form id="product-form"><input type="hidden" id="product-id"><div class="field"><label for="product-name">Name</label><input id="product-name" maxlength="100" required></div><div class="field"><label for="product-description">Description</label><textarea id="product-description" maxlength="500"></textarea></div><div class="field"><label for="product-price">Price (USD)</label><input id="product-price" type="number" min="0" max="9999" step="0.01" required></div><div class="field"><label for="product-photo">Photo</label><input id="product-photo" type="file" accept="image/*"></div><label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0"><input id="product-active" type="checkbox" checked> Visible in shop</label><button id="save-product" type="submit">Save product</button><button id="cancel-edit" type="button" class="secondary hidden">Cancel</button><p id="product-status" class="notice" aria-live="polite"></p></form></section><section class="admin-card"><h2>Current products</h2><div id="admin-products" class="admin-list">Loading…</div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
